project:
  name: demand-forecast-platform
  seed: 42

data:
  raw_path: data/raw/sales.parquet
  processed_path: data/processed/features.parquet
  n_stores: 8
  n_skus: 25
  start_date: "2022-01-01"
  end_date: "2024-12-31"

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 28]
  fourier_order: 3

split:
  # Last `test_horizon` days are the hold-out; the block before it is validation.
  test_horizon: 28
  val_horizon: 28

model:
  target: units_sold
  quantiles: [0.5, 0.9]
  params:
    objective: quantile
    n_estimators: 700
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 40
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbosity: -1

inventory:
  service_level: 0.95
  lead_time_days: 7
  review_period_days: 7
  holding_cost_rate: 0.25      # annual, as fraction of unit cost
  ordering_cost: 75.0          # cost per purchase order
  stockout_penalty_mult: 3.0   # underage cost = margin * this

mlflow:
  # MLflow 3.x deprecated the file store; sqlite is the supported local backend.
  # In prod point this at Postgres: postgresql://user:pass@host:5432/mlflow
  tracking_uri: sqlite:///mlflow.db
  experiment_name: demand-forecasting

monitoring:
  psi_threshold: 0.2
  ks_alpha: 0.05

api:
  host: 0.0.0.0
  port: 8000
  model_dir: artifacts
